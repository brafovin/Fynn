<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wilde Happen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Titan+One&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Sticker-Bogen: dicke Tintenkonturen, harte Schlagschatten, satte Farben auf Papierweiß. */
  --ink: #1d2340;
  --paper: #fff8e7;
  --coin: #ffc931;
  --power: #ff5d73;
  --leaf: #37c871;
  --sky: #4cc3ff;
  --mute: #cfd3df;
  --font-display: "Titan One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Baloo 2", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden; background: var(--sky); color: var(--ink);
  font-family: var(--font-body); font-weight: 700; font-size: 16px; line-height: 1.25;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
#gl, #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#cv { cursor: crosshair; touch-action: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud button { pointer-events: auto; }
#top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 10px 12px; }
#stats { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
.pill {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 3px 14px 3px 8px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 4px 0 var(--ink);
  font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill small { font-family: var(--font-body); font-weight: 800; font-size: 13px; color: #1f9a55; }
.pill .em { font-size: 22px; line-height: 1; }
.pill.power b { color: #d92f49; }
.coin {
  display: inline-block; flex: none; width: 1.05em; height: 1.05em; border-radius: 50%; vertical-align: -0.16em;
  background: radial-gradient(circle at 35% 30%, #fff3b8 0 18%, var(--coin) 19% 100%);
  border: 0.14em solid var(--ink); box-shadow: inset -0.08em -0.1em 0 #e09a12;
}
.pill > .coin { font-size: 24px; }
#menu { display: flex; gap: 8px; }
.rb {
  position: relative; width: 48px; height: 48px; padding: 0; border-radius: 16px; font-size: 24px; line-height: 1;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
}
.rb:active, .act:active, .food:active, .buy:active, .ghost:active, #start:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.rb i {
  position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); padding: 0 5px;
  background: var(--coin); border: 2px solid var(--ink); border-radius: 9px;
  font: 800 11px/1.35 var(--font-body); font-style: normal; white-space: nowrap;
}
#mid { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(44%, 560px); display: flex; flex-direction: column; align-items: center; gap: 9px; }
#goal {
  max-width: 100%;
  display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  font-size: 15px; font-weight: 800;
}
#goal::before {
  content: "Ziel"; flex: none; padding: 1px 8px; border-radius: 9px; background: var(--ink); color: var(--paper);
  font: 13px/1.5 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
}
#toasts { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast {
  padding: 5px 14px; background: var(--ink); color: var(--paper); border-radius: 14px; font-size: 15px; text-align: center;
  animation: pop .22s cubic-bezier(.3, 1.6, .5, 1); transition: opacity .4s, transform .4s;
}
.toast.good { background: var(--leaf); color: var(--ink); border: 3px solid var(--ink); }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#banner {
  position: absolute; top: 27%; left: 0; right: 0; text-align: center; opacity: 0; transform: scale(.9);
  font: clamp(34px, 8vw, 68px)/1 var(--font-display); color: var(--paper); letter-spacing: .02em;
  -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink);
  transition: opacity .35s, transform .35s cubic-bezier(.3, 1.5, .5, 1);
}
#banner.show { opacity: 1; transform: scale(1) rotate(-2deg); }
#right { position: absolute; right: 12px; bottom: 84px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.act {
  min-width: 150px; min-height: 60px; padding: 8px 20px; border-radius: 22px;
  background: var(--leaf); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
  font: 21px/1.1 var(--font-display); letter-spacing: .01em;
}
.act.pull { background: var(--power); color: var(--paper); }
.act.warn { background: var(--coin); }
.act kbd { display: block; margin-top: 2px; font: 800 11px var(--font-body); opacity: .75; }
#hotbar { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 7px; padding: 8px 10px 0; overflow-x: auto; scrollbar-width: none; }
#hotbar::-webkit-scrollbar { display: none; }
.food {
  position: relative; flex: none; width: 52px; height: 52px; padding: 0; border-radius: 15px; font-size: 27px; line-height: 1;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transition: transform .12s;
}
.food.sel { background: var(--leaf); transform: translateY(-7px); box-shadow: 0 7px 0 var(--ink); }
.food i { position: absolute; top: -8px; left: -6px; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: var(--paper); font: 800 11px/19px var(--font-body); font-style: normal; }
@media (pointer: coarse) { .food i, .act kbd { display: none; } }

/* ---------- Fenster ---------- */
#panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 14px; background: rgba(29, 35, 64, .55); }
.sheet {
  position: relative; width: min(100%, 600px); max-height: min(100%, 720px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding: 0 18px 18px; background: var(--paper); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink);
  -webkit-user-select: none; user-select: none;
}
.sheet h2 {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: 10px; margin: 0 -18px; padding: 14px 64px 10px 18px;
  background: var(--paper); border-bottom: 3px solid var(--ink); font: 28px/1.1 var(--font-display); text-wrap: balance;
}
.sheet h2 span { font: 800 15px var(--font-body); padding: 1px 9px; border-radius: 10px; background: var(--coin); border: 2px solid var(--ink); white-space: nowrap; }
.sheet h3 { margin: 16px 0 2px; font: 17px var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: #5b6390; }
.x { position: fixed; z-index: 2; margin: 10px 0 0; width: 40px; height: 40px; border-radius: 13px; background: var(--power); color: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 18px var(--font-display); }
.sheet .x { position: sticky; top: 10px; float: right; margin: 10px -6px -50px 0; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 2px dashed rgba(29, 35, 64, .16); }
.row:last-child { border-bottom: 0; }
.row .ic { font-size: 34px; line-height: 1; text-align: center; }
.row .tx b { display: block; font-size: 17px; font-weight: 800; }
.row .tx span { display: block; font-size: 14px; font-weight: 600; color: #4b5278; }
.row .tx em { font-style: normal; color: #1f9a55; font-weight: 800; }
.row .bt { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.row .tx .stars { display: inline; color: #e79a00; font-size: 16px; letter-spacing: 1px; }
.buy, .ghost {
  min-width: 92px; min-height: 42px; padding: 4px 12px; border-radius: 14px; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  background: var(--leaf); font: 16px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.buy small { display: block; font: 800 11px var(--font-body); }
.buy.poor { background: var(--mute); color: #5b6390; }
.buy.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.ghost { background: var(--paper); font-size: 14px; min-width: 0; }
.ghost.sure { background: var(--power); color: var(--paper); }
.own { font-weight: 800; color: #1f9a55; white-space: nowrap; padding-right: 4px; }
.lock { font-weight: 800; color: #5b6390; white-space: nowrap; }
.note { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: #4b5278; }
.zonehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 2px; }
.zonehead h3 { margin: 0; }
.foot { margin-top: 18px; padding-top: 12px; border-top: 3px solid var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ---------- Startbild ---------- */
#title { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(29, 35, 64, .35); overflow-y: auto; touch-action: pan-y; }
.card { width: min(100%, 470px); padding: 22px 22px 24px; text-align: center; background: var(--paper); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 9px 0 var(--ink); }
.logo { margin: 0 0 6px; font: clamp(44px, 13vw, 70px)/.92 var(--font-display); letter-spacing: .01em; }
.logo span { display: block; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; }
.logo span:first-child { color: var(--paper); transform: rotate(-4deg) translateX(-8%); text-shadow: 0 5px 0 var(--ink); }
.logo span:last-child { color: var(--coin); transform: rotate(2deg) translateX(6%); text-shadow: 0 5px 0 var(--ink); }
.card p { margin: 14px auto 12px; max-width: 34ch; font-size: 17px; text-wrap: balance; }
.how { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 7px; text-align: left; font-size: 15px; }
.how li { display: grid; grid-template-columns: 34px 78px 1fr; align-items: center; gap: 4px; padding: 5px 10px; border: 2px dashed rgba(29, 35, 64, .3); border-radius: 13px; }
.how li span { font-size: 21px; }
.how li b { font-family: var(--font-display); font-weight: 400; }
#start { min-width: 220px; min-height: 60px; padding: 8px 26px; border-radius: 22px; background: var(--leaf); border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font: 26px var(--font-display); }

@media (max-width: 900px) and (min-height: 481px) {
  #mid { top: 112px; width: 94%; }
}
@media (max-width: 760px) {
  .pill { font-size: 17px; min-height: 36px; padding-right: 11px; }
  .rb { width: 44px; height: 44px; font-size: 22px; border-radius: 14px; }
  #menu { gap: 6px; }
  #goal { font-size: 14px; }
  .act { min-width: 132px; min-height: 58px; font-size: 19px; }
  .food { width: 46px; height: 46px; font-size: 24px; }
  #hotbar { justify-content: safe center; }
  .sheet h2 { font-size: 24px; }
  .buy { min-width: 80px; font-size: 15px; padding: 4px 9px; }
}
@media (max-height: 480px) {
  #mid { top: 10px; width: 40%; }
  #goal { font-size: 13px; }
  #right { bottom: 70px; }
  .act { min-height: 50px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .buy.shake { animation: none; }
  #banner, .food, .toast { transition: none; }
}
</style>
</head>
<body>
<canvas id="gl" aria-label="Spielfeld"></canvas>
<canvas id="cv" aria-hidden="true"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div id="stats">
      <div class="pill" title="Münzen"><i class="coin"></i><b id="money">0</b><small id="rate">+0/s</small></div>
      <div class="pill power" title="Kraft"><span class="em">💪</span><b id="power">0</b></div>
    </div>
    <div id="menu">
      <button class="rb" id="b-shop" type="button" title="Shop (B)" aria-label="Shop">🛒</button>
      <button class="rb" id="b-pen" type="button" title="Gehege (G)" aria-label="Gehege">🏡<i id="pen-badge">0/4</i></button>
      <button class="rb" id="b-book" type="button" title="Tierbuch (T)" aria-label="Tierbuch">📖</button>
      <button class="rb" id="b-mute" type="button" title="Ton an/aus (M)" aria-label="Ton an oder aus">🔊</button>
    </div>
  </div>
  <div id="mid">
    <div id="goal"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <div id="banner"></div>
  <div id="right">
    <button class="rb" id="b-home" type="button" title="Nach Hause (H)" aria-label="Nach Hause" hidden>🏠</button>
    <button class="act" id="b-act" type="button" hidden></button>
  </div>
  <div id="hotbar"></div>
</div>

<div id="panel" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="x" id="b-close" type="button" aria-label="Schließen">✕</button>
    <div id="panel-body"></div>
  </div>
</div>

<div id="title">
  <div class="card">
    <h1 class="logo"><span>Wilde</span><span>Happen</span></h1>
    <p>Locke Tiere mit Futter an, füll dein Gehege und werde stark genug für neue Zonen.</p>
    <ul class="how">
      <li><span>👟</span><b>Laufen</b>WASD oder Finger ziehen</li>
      <li><span>🥕</span><b>Werfen</b>Klicken oder tippen</li>
      <li><span>💪</span><b>Aktion</b>Leertaste oder Knopf rechts</li>
    </ul>
    <button id="start" type="button">Los geht's!</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    let t = Math.imul(a ^ a >>> 15, 1 | a);

  if (!isFinite(n)) return '∞';
  if (n < 1000) return String(Math.floor(n + 1e-9));
  for (const [v, u] of UNITS) {
    if (n >= v) {
      const x = Math.floor(n / v * 100) / 100;
      let t = x >= 100 ? String(Math.floor(x)) : x >= 10 ? x.toFixed(1) : x.toFixed(2);

      return t.replace('.', ',') + u;

  return String(Math.floor(n));

function buildWorld() {
  const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const tex = (c, rx, ry) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = aniso; return t; };
  water = new THREE.Mesh(new THREE.PlaneGeometry(40000, 20000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: tex(makeWater(), 40000 / 256, 20000 / 256) }));
  water.position.set(WORLD_W / 2, -18, WH / 2); scene.add(water);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(WORLD_W + 100, 30, WH + 100), new THREE.MeshLambertMaterial({ color: '#f7e6a6' }));
  slab.position.set(WORLD_W / 2, -15.5, WH / 2); slab.receiveShadow = true; scene.add(slab);

  for (const z of ZONES) {
    const w = z.x1 - z.x0;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(w, WH).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ map: tex(makeGround(z), w / 256, WH / 256) }));
    ground.position.set(z.x0 + w / 2, 0, WH / 2); ground.receiveShadow = true; scene.add(ground);
    z.skyC = new THREE.Color(SKY[z.id]);
    buildDecor(z);
    if (z.i < 2) continue;
    // Felsmauer mit Lücke, davor der große Felsbrocken
    const B = new Bld(), r = mulberry32(z.i * 53);
    for (let y = -20, n = 0; y < WH + 40; y += 44, n++) {
      if (y > MID - GATE_HALF - 16 && y < MID + GATE_HALF + 16) continue;
      B.rock(34 + r() * 8, z.x0 + (r() - 0.5) * 14, 22 + r() * 6, y, n % 3 ? '#a3a8bf' : '#8f95b0', r() * 3, r() * 3, r() * 3, 0.9);
    }
    scene.add(solid(B.geo()));
    z.rock = solid(new Bld().add(new THREE.DodecahedronGeometry(BOULDER_R + 6, 0), '#9aa0b8', 0, 0, 0, 0.3, z.i, 0.2, 1.05, 0.92, 1).geo());
    z.rock.position.set(z.x0, 66, MID); scene.add(z.rock);

  bigObst = decor.filter(d => d.col >= 40);

  flat(PEN_CX - 36, PEN_Y1 - 30, 72, 140, 22, '#edd49c', 1.1);
  flat(BAR.x - 36, MID + 30, 72, 260, 22, '#edd49c', 1.1);
  const paths = new THREE.Mesh(F.geo(), FLAT); paths.receiveShadow = true; scene.add(paths);

  // Zuhause: Klimmzugstange und Shop
  const H = new Bld();

/* Das Gehege wächst mit jedem Ausbau, also wird es bei Bedarf neu gebaut. */
function buildPen() {
  if (!scene) return;
  if (penGrp) { scene.remove(penGrp); penGrp.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  penGrp = new THREE.Group();
  const r = penRect(), B = new Bld(), WOOD = '#d79a55', WOOD2 = '#b9793a';
  const floor = new THREE.Mesh(new Bld().add(new THREE.ShapeGeometry(rrShape(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0, 14), 6), '#f5e2a0', 0, 1.6, 0, Math.PI / 2).geo(), FLAT);
  floor.receiveShadow = true; penGrp.add(floor);
  const run = (x0, z0, x1, z1) => {   // ein Zaunstück mit zwei Latten und Pfosten
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.round(len / 46)), alongX = Math.abs(x1 - x0) > Math.abs(z1 - z0);
    for (const y of [15, 29]) B.box(alongX ? len : 4, 5, alongX ? 4 : len, (x0 + x1) / 2, y, (z0 + z1) / 2, WOOD);
    for (let i = 0; i <= n; i++) B.box(9, 40, 9, x0 + (x1 - x0) * i / n, 20, z0 + (z1 - z0) * i / n, WOOD2);
  };
  run(r.x0, r.y0, r.x1, r.y0); run(r.x0, r.y0, r.x0, r.y1); run(r.x1, r.y0, r.x1, r.y1);
  run(r.x0, r.y1, r.gx0, r.y1); run(r.gx1, r.y1, r.x1, r.y1);
  LR(s => { const x = s < 0 ? r.gx0 : r.gx1; B.box(12, 62, 12, x, 31, r.y1, WOOD2); B.ball(8.5, x, 66, r.y1, COIN); });
  LR(s => B.box(9, 86, 9, PEN_CX + s * 88, 43, r.y0, WOOD2));
  B.box(190, 44, 4, PEN_CX, 76, r.y0 - 1, WOOD, -0.25);
  penGrp.add(solid(B.geo()));
  if (!penSign) penSign = makeSign(512, 120);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(176, 38), new THREE.MeshBasicMaterial({ map: penSign.t, transparent: true }));
  sign.position.set(PEN_CX, 76, r.y0 + 2); sign.rotation.x = -0.25; penGrp.add(sign);
  scene.add(penGrp); signKey = '';
}

/* ---------- Wilde Tiere ---------- */
function spawnWild(z, anywhere) {

}
function stepTo(a, tx, ty, speed, dt, stop) {
  const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);

}
function dropFood(a) { if (a.food) { a.food.claim = null; a.food = null; } }
function lookForFood(a) {

function updateWild(dt) {

/* ---------- Begleiter und Gehege ---------- */
function updateFollowers(dt) {

/* ---------- Spieler bewegen ---------- */
const keys = Object.create(null);
const joy = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
const aim = { x: 0, y: 0, over: false, down: false, id: null };
const taps = new Map();
let actHeld = false, actT = 0;

function inputVec() {
  let x = 0, y = 0;
  if (keys.a || keys.arrowleft) x -= 1;
  if (keys.d || keys.arrowright) x += 1;
  if (keys.w || keys.arrowup) y -= 1;
  if (keys.s || keys.arrowdown) y += 1;
  if (joy.id !== null) { x += joy.dx / 54; y += joy.dy / 54; }
  const m = Math.hypot(x, y);
  if (m < 0.16) return [0, 0];
  return m > 1 ? [x / m, y / m] : [x, y];
}
function pushOut(cx, cy, R) {
  const d = dist(player.x, player.y, cx, cy);
  if (d >= R) return false;
  const k = d || 1; player.x = cx + (player.x - cx) / k * R; player.y = cy + (player.y - cy) / k * R;
  return true;
}
function movePlayer(dt) {
  const [ix, iy] = panelOpen ? [0, 0] : inputVec();
  if (player.cd > 0) player.cd -= dt;
  if (player.throwT > 0) player.throwT -= dt;
  if (player.mode === 'pullup') {
    player.grace -= dt;
    if (pull.anim > 0) { pull.anim += dt / 0.26; if (pull.anim >= 1) pull.anim = 0; }
    if (time - pull.last > 1.3) pull.combo = 0;
    if ((ix || iy) && player.grace <= 0) { player.mode = 'walk'; player.y = BAR.y + 22; pull.anim = 0; }
    else { player.x = BAR.x; player.y = BAR.y; player.moving = false; return; }
  }
  const sp = speedOf();
  player.moving = !!(ix || iy);
  if (player.moving) {
    player.x += ix * sp * dt; player.y += iy * sp * dt; player.walkT += dt;
    player.moveH = Math.atan2(ix, iy);
    if (Math.abs(ix) > 0.15) player.face = ix > 0 ? 1 : -1;
  }
  for (const w of walls) {
    const cx = clamp(player.x, w.x0, w.x1), cy = clamp(player.y, w.y0, w.y1);
    const dx = player.x - cx, dy = player.y - cy, d = Math.hypot(dx, dy);
    if (d >= PR) continue;
    if (d > 0.001) { player.x = cx + dx / d * PR; player.y = cy + dy / d * PR; }
    else {
      const l = player.x - w.x0, rgt = w.x1 - player.x, t = player.y - w.y0, b = w.y1 - player.y, m = Math.min(l, rgt, t, b);
      if (m === l) player.x = w.x0 - PR; else if (m === rgt) player.x = w.x1 + PR; else if (m === t) player.y = w.y0 - PR; else player.y = w.y1 + PR;
    }
  }
  for (const d of decor) {   // Baumstämme, Felsen, Vulkane

    else { g.fillStyle = q.col; g.beginPath(); g.arc(p.x, p.y, sz, 0, TAU); g.fill(); }

    if (t.icon) { label(g, t.s, p.x - sz * 0.55, p.y, sz, t.col); const w = g.measureText(t.s).width; g.drawImage(emoji(t.icon), p.x - sz * 0.55 + w / 2 + 2, p.y - sz * 0.62, sz * 1.2, sz * 1.2); }

    g.fillStyle = PAPER; g.beginPath(); g.arc(joy.ox + joy.dx, joy.oy + joy.dy, 25, 0, TAU); g.fill(); g.stroke();

}
function drawGoalArrow(g) {
  const o = goal.target, p = proj(o.x, o.h || 60, o.y), m = 44, bounce = Math.abs(Math.sin(time * 5)) * 9;

  if (p.ok && p.x > m && p.x < W - m && p.y > m + 90 && p.y < Hs - m - 60) { px = p.x; py = p.y - 16 - bounce; ang = Math.PI / 2; }
  else {
    const cx = W / 2, cy = Hs / 2; ang = Math.atan2(o.y - cam.y, o.x - cam.x);
    const hw = W / 2 - m, hh = Hs / 2 - m - 44, t = Math.min(hw / Math.abs(Math.cos(ang) || 1e-6), hh / Math.abs(Math.sin(ang) || 1e-6)) - bounce;
    px = cx + Math.cos(ang) * t; py = cy + Math.sin(ang) * t;
  }
  g.save(); g.translate(px, py); g.rotate(ang);
  g.beginPath(); g.moveTo(18, 0); g.lineTo(-10, -15); g.lineTo(-4, 0); g.lineTo(-10, 15); g.closePath();

}

/* =====================================================================
   HUD und Fenster
   ===================================================================== */
const lastText = new Map();
function setText(el, s) { if (lastText.get(el) !== s) { lastText.set(el, s); el.textContent = s; } }
const elMoney = $('money'), elRate = $('rate'), elPower = $('power'), elGoal = $('goal'), elAct = $('b-act'), elHome = $('b-home'), elBadge = $('pen-badge');
let lastAct = '', afford = 0;
function updateHud(dt) {
  setText(elMoney, fmt(S.money)); setText(elRate, '+' + fmtRate(totalIncome()) + '/s'); setText(elPower, fmt(S.strength));
  setText(elBadge, S.pen.length + '/' + S.cap); setText(elGoal, goal.text);
  const a = started && !panelOpen ? currentAction() : null, key = a ? a.id : '';
  if (key !== lastAct) {
    lastAct = key; elAct.hidden = !a;
    if (a) { elAct.className = 'act ' + a.cls; elAct.innerHTML = a.label + '<kbd>Leertaste</kbd>'; }
  }
  const away = curZone.i !== 0 && started;
  if (elHome.hidden === away) elHome.hidden = !away;
  if (panelOpen && (afford -= dt) <= 0) { afford = 0.3; for (const b of document.querySelectorAll('#panel-body .buy')) b.classList.toggle('poor', S.money < +b.dataset.cost); }
}
function buildHotbar() {
  const own = FOODS.filter(f => S.foods[f.id]);
  $('hotbar').innerHTML = own.map((f, i) => `<button class="food${f.id === S.sel ? ' sel' : ''}" type="button" data-food="${f.id}" title="${f.name}" aria-label="${f.name}">${f.e}<i>${i + 1}</i></button>`).join('');
}
function selectFood(id) { if (!S.foods[id] || S.sel === id) return; S.sel = id; sfx.click(); buildHotbar(); }
$('hotbar').addEventListener('click', e => { const b = e.target.closest('[data-food]'); if (b) { audioInit(); selectFood(b.dataset.food); } });

const buyBtn = (act, id, cost, extra) => `<button class="buy${S.money < cost ? ' poor' : ''}" type="button" data-act="${act}" data-id="${id}" data-cost="${cost}">${extra || ''}<i class="coin"></i> ${fmt(cost)}</button>`;
function shopHtml() {
  let h = '<h2>Shop</h2><h3>Futter</h3>';
  for (const f of FOODS) {
    const fans = SPECIES.filter(s => s.food === f.id && s.zone <= S.unlocked + 1).map(s => s.e).join(' ') || '❓';
    h += `<div class="row"><div class="ic">${f.e}</div><div class="tx"><b>${f.name}</b><span>Schmeckt: ${fans}</span></div>` +
      (S.foods[f.id] ? '<div class="own">✔ Hast du</div>' : buyBtn('food', f.id, f.price)) + '</div>';
  }
  h += '<h3>Upgrades</h3>';
  h += `<div class="row"><div class="ic">🏡</div><div class="tx"><b>Größeres Gehege</b><span>Plätze: ${S.cap}` + (S.cap < MAX_CAP ? ` → <em>${S.cap + 1}</em></span></div>${buyBtn('cap', 'cap', capCost())}` : `</span></div><div class="own">✔ Maximal</div>`) + '</div>';
  for (const u of UPG) {
    const l = S.up[u.id], max = l >= u.max;
    const desc = u.val ? `${u.what}: ${u.val(l)}` + (max ? '' : ` → <em>${u.val(l + 1)}</em>`) : u.what;
    h += `<div class="row"><div class="ic">${u.e}</div><div class="tx"><b>${u.name}${u.max > 1 ? ` <span style="display:inline">· Stufe ${l}/${u.max}</span>` : ''}</b><span>${desc}</span></div>` +
      (max ? '<div class="own">✔ Maximal</div>' : buyBtn('up', u.id, u.cost(l))) + '</div>';

}
function penHtml() {
  let h = `<h2>Dein Gehege <span>${S.pen.length} / ${S.cap} Plätze</span></h2>`;
  h += `<div class="row"><div class="ic">🏡</div><div class="tx"><b>Größeres Gehege</b><span>Plätze: ${S.cap}` + (S.cap < MAX_CAP ? ` → <em>${S.cap + 1}</em></span></div>${buyBtn('cap', 'cap', capCost())}` : `</span></div><div class="own">✔ Maximal</div>`) + '</div>';
  if (followers.length) h += `<p class="note">Warten draußen: ${followers.map(f => f.sp.e).join(' ')}. Lauf mit ihnen ins Gehege und platziere sie.</p>`;
  h += `<h3>Deine Tiere · zusammen +${fmtRate(totalIncome())}/s</h3>`;
  if (!S.pen.length) h += '<p class="note">Noch leer. Locke ein Tier mit Futter an, bis es zahm ist, und bring es her.</p>';
  const order = S.pen.map((a, i) => i).sort((a, b) => incomeOf(S.pen[b]) - incomeOf(S.pen[a]));
  for (const i of order) {
    const a = S.pen[i];
    h += `<div class="row"><div class="ic">${a.sp.e}</div><div class="tx"><b>${a.sp.name} <span class="stars">${'★'.repeat(a.lvl)}</span></b><span>Verdient <em>+${fmtRate(incomeOf(a))}/s</em></span></div><div class="bt">` +
      (a.lvl < MAX_LVL ? buyBtn('lvl', i, lvlCost(a), '<small>Stufe ' + (a.lvl + 1) + '</small>') : '<div class="own">✔ Maximal</div>') +
      `<button class="ghost" type="button" data-act="sell" data-id="${i}">Verkaufen</button></div></div>`;
  }
  return h;
}
function bookHtml() {
  const n = SPECIES.filter(s => S.tamed[s.id]).length;
  let h = `<h2>Tierbuch <span>${n} / ${SPECIES.length} gezähmt</span></h2>`;
  h += `<div class="zonehead"><h3>Zuhause</h3><button class="ghost" type="button" data-act="go" data-id="0">Hinreisen</button></div>`;
  for (let i = 1; i < ZONES.length; i++) {
    const z = ZONES[i], open = i <= S.unlocked, known = i <= S.unlocked + 1;
    h += `<div class="zonehead"><h3>${known ? z.name : '???'}</h3>` + (open ? `<button class="ghost" type="button" data-act="go" data-id="${i}">Hinreisen</button>` : `<div class="lock">🔒 💪 ${fmt(z.need)}</div>`) + '</div>';
    for (const s of z.animals) {
      const f = FOOD[s.food];
      h += known
        ? `<div class="row"><div class="ic">${s.e}</div><div class="tx"><b>${s.name}</b><span>Mag ${f.e} ${f.name} · ${Math.ceil(s.need / spiceOf())} Happen · <em>+${fmtRate(s.income * bellOf())}/s</em></span></div><div class="${S.tamed[s.id] ? 'own' : 'lock'}">${S.tamed[s.id] ? '✔ ' + S.tamed[s.id] + '×' : 'Noch nie'}</div></div>`
        : `<div class="row"><div class="ic">❓</div><div class="tx"><b>Unbekanntes Tier</b><span>Erst die Zone davor freischalten</span></div><div class="lock">🔒</div></div>`;
    }
  }
  h += `<div class="foot"><span class="note" style="margin:0">Dein Spielstand wird in diesem Browser gespeichert.</span><button class="ghost" type="button" data-act="reset">Neu anfangen</button></div>`;

}
function renderPanel() { $('panel-body').innerHTML = panelOpen === 'shop' ? shopHtml() : panelOpen === 'pen' ? penHtml() : bookHtml(); }
function openPanel(name) {
  if (!started) return;
  panelOpen = name; actHeld = false; aim.down = false; joy.id = null; for (const k in keys) keys[k] = false;
  renderPanel(); $('panel').hidden = false; $('panel').querySelector('.sheet').scrollTop = 0; $('b-close').focus({ preventScroll: true });
}
function closePanel() { panelOpen = null; $('panel').hidden = true; lastAct = '?'; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function spend(cost, btn) {
  if (S.money >= cost) { S.money -= cost; sfx.buy(); return true; }
  sfx.deny();
  if (btn) { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
  return false;
}
$('panel-body').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  audioInit();
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'food') { const f = FOOD[id]; if (f && !S.foods[id] && spend(f.price, b)) { S.foods[id] = true; S.sel = id; buildHotbar(); toast(`${f.e} ${f.name} gekauft! Unten in der Leiste auswählen.`, true); } else return; }
  else if (act === 'up') { const u = UPG.find(x => x.id === id), l = S.up[id]; if (!u || l >= u.max || !spend(u.cost(l), b)) return; S.up[id]++; }

    const a = S.pen[+id]; if (!a) return;
    if (!b.classList.contains('sure')) { b.classList.add('sure'); b.innerHTML = 'Sicher? +<i class="coin"></i> ' + fmt(sellValue(a) + a.stash); sfx.click(); return; }

    if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Wirklich alles löschen?'; sfx.click(); return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* egal */ }
    boot({}); closePanel(); toast('Neues Spiel gestartet.'); return;
  }

});
$('panel').addEventListener('click', e => { if (e.target === $('panel')) closePanel(); });
$('hud').addEventListener('click', e => { const b = e.target.closest('button'); if (b && e.detail > 0) b.blur(); });
$('b-close').addEventListener('click', () => { sfx.click(); closePanel(); });
$('b-shop').addEventListener('click', () => { audioInit(); sfx.click(); openPanel('shop'); });
$('b-pen').addEventListener('click', () => { audioInit(); sfx.click(); openPanel('pen'); });
$('b-book').addEventListener('click', () => { audioInit(); sfx.click(); openPanel('book'); });
function setMute(m) { S.muted = m; $('b-mute').textContent = m ? '🔇' : '🔊'; }
$('b-mute').addEventListener('click', () => { audioInit(); setMute(!S.muted); sfx.click(); save(); });
elHome.addEventListener('click', () => { audioInit(); travel(0); });
elAct.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); doAction(); actHeld = true; actT = 0.4; });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) elAct.addEventListener(ev, () => { actHeld = false; });
elAct.addEventListener('click', e => { if (e.detail === 0) doAction(); });  // Tastatur-Auslösung über Enter

/* =====================================================================
   Eingabe
   ===================================================================== */
window.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if (!started) return;
  if (panelOpen) { if (k === 'escape') closePanel(); return; }
  if (e.target instanceof HTMLButtonElement && (k === ' ' || k === 'enter')) { if (e.target !== elAct) return; }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  audioInit();
  keys[k] = true;
  if (k === ' ' || k === 'e') { doAction(); actHeld = true; actT = 0.4; }
  else if (k >= '1' && k <= '9') { const own = FOODS.filter(f => S.foods[f.id]); if (own[+k - 1]) selectFood(own[+k - 1].id); }
  else if (k === 'b') openPanel('shop');
  else if (k === 'g') openPanel('pen');
  else if (k === 't') openPanel('book');
  else if (k === 'h') travel(0);
  else if (k === 'm') { setMute(!S.muted); save(); }
});
window.addEventListener('keyup', e => { const k = (e.key || '').toLowerCase(); keys[k] = false; if (k === ' ' || k === 'e') actHeld = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; actHeld = false; aim.down = false; joy.id = null; taps.clear(); });

cv.addEventListener('pointerdown', e => {
  audioInit();
  if (!started || panelOpen) return;
  if (e.pointerType === 'mouse') {
    if (e.button !== 0) return;
    aim.x = e.clientX; aim.y = e.clientY; aim.down = true; aim.over = true;
    const w = toWorld(aim.x, aim.y); throwAt(w.x, w.y);
  } else {
    aim.over = false;
    taps.set(e.pointerId, { x: e.clientX, y: e.clientY });   // Tippen = werfen, Ziehen = laufen
  }
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* nicht schlimm */ }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { aim.x = e.clientX; aim.y = e.clientY; aim.over = true; return; }
  if (e.pointerId === joy.id) {
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const d = Math.hypot(dx, dy);
    if (d > 54) { dx = dx / d * 54; dy = dy / d * 54; }
    joy.dx = dx; joy.dy = dy; return;
  }
  const t = taps.get(e.pointerId);
  if (t && joy.id === null && dist(e.clientX, e.clientY, t.x, t.y) > 12) {
    taps.delete(e.pointerId); joy.id = e.pointerId; joy.ox = t.x; joy.oy = t.y; joy.dx = e.clientX - t.x; joy.dy = e.clientY - t.y;
  }
});
function pointerEnd(e) {
  if (e.pointerType === 'mouse') { aim.down = false; return; }
  if (e.pointerId === joy.id) { joy.id = null; joy.dx = joy.dy = 0; return; }
  const t = taps.get(e.pointerId);
  if (t) {
    taps.delete(e.pointerId);
    if (e.type === 'pointerup' && dist(e.clientX, e.clientY, t.x, t.y) < 16) { const w = toWorld(e.clientX, e.clientY); throwAt(w.x, w.y); }
  }
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') aim.over = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); zoom = clamp(zoom * (e.deltaY > 0 ? 1.1 : 1 / 1.1), 0.6, 1.5); }, { passive: false });

/* =====================================================================
   Start
   ===================================================================== */
function grantAway(sec) {
  const amt = Math.floor(totalIncome() * Math.min(sec, 3600));
  if (amt < 1) return;
  S.money += amt;
  if (sec > 20) toast(`Willkommen zurück! Deine Tiere haben ${fmt(amt)} Münzen verdient.`, true);
}
function boot(data) {
  const had = applySave(data);
  wild.length = bites.length = parts.length = texts.length = followers.length = 0;
  ZONES.forEach(z => { z.count = 0; z.wob = 0; });
  player.x = S.px; player.y = S.py; player.mode = 'walk'; player.face = 1; player.cd = 0; player.hdg = player.moveH = 0; pull.anim = 0; pull.combo = 0;
  cam.x = clamp(player.x, 260, WORLD_W - 260); cam.y = clamp(player.y, 170, WH - 30); curZone = zoneAt(player.x);
  scene.fog.color.copy(curZone.skyC);
  (S._followers || []).forEach((id, k) => followers.push({ sp: SP[id], x: player.x - 60 - k * 40, y: player.y + 10, face: 1, ph: rand(0, TAU), moving: false, pop: 0, inst: null }));
  delete S._followers;
  rebuildWalls();
  for (let i = 1; i < ZONES.length; i++) for (let n = 0; n < MAXW; n++) spawnWild(ZONES[i], true);
  // Zum Start steht garantiert ein Huhn in der Nähe.
  if (!had) { const c = wild.find(a => a.sp.id === 'chicken'); if (c) { c.x = c.tx = HOME_W + 150; c.y = c.ty = MID - 120; } }
  setMute(S.muted); buildHotbar(); computeGoal(); lastText.clear(); lastAct = '?';
  if (had) grantAway((Date.now() - S.t) / 1000);
  return had;
}
function startGame() {
  audioInit();
  started = true; $('title').hidden = true; $('hud').hidden = false; $('start').blur();
  sfx.buy(); banner(curZone.name);
}
$('start').addEventListener('click', startGame);
function fail(msg) {
  const card = document.querySelector('#title .card');
  card.querySelector('p').textContent = msg; card.querySelector('.how').hidden = true; $('start').hidden = true;
}

let lastFrame = 0, lastWall = Date.now();
function frame(now) {
  let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (!(dt > 0)) dt = 0.016;
  if (started) watchSpeed(dt * 1000);
  const wall = Date.now();
  if (wall - lastWall > 5000 && started) grantAway((wall - lastWall) / 1000);
  lastWall = wall;
  if (dt > 0.05) dt = 0.05;
  update(dt); sync3D(dt); renderer.render(scene, camera); overlay(); updateHud(dt);

document.addEventListener('visibilitychange', () => { if (document.hidden && started) save(); });
window.addEventListener('pagehide', () => { if (started) save(); });

function start(hot) {
  if (!window.THREE) return fail('Die 3D-Technik konnte nicht geladen werden. Prüf deine Internetverbindung und lade die Seite neu.');
  try { init3D(); resize(); buildWorld(); }
  catch (e) { console.error(e); return fail('Dein Browser kann hier leider kein 3D anzeigen. Probier einen anderen Browser oder ein anderes Gerät.'); }
  const had = boot(hot && hot.v === 1 ? hot : loadLocal());
  if (had) $('start').textContent = 'Weiterspielen';
  if (document.fonts && document.fonts.load) document.fonts.load('20px "Titan One"').catch(() => {});
  requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => serialize());
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

window.__wildeHappen = { get S() { return S; }, get camera() { return camera; }, get quality() { return quality; }, lockQuality() { qLock = true; }, player, wild, followers, bites, travel, throwAt, doAction, penRect, ZONES, proj, model };
})();
